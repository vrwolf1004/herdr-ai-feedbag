id = "herdr-ai-feedbag"
name = "herdr-ai-feedbag"
version = "0.3.0"
min_herdr_version = "0.9.0"
platforms = ["windows", "linux", "macos"]
description = "Claude Code and GitHub Copilot plan usage in one block at the bottom of the herdr sidebar — no per-agent duplicates"

# Python 3.8+ 표준 라이브러리만 쓴다. 실행기 이름이 OS 마다 달라(Windows: python, Linux/macOS: python3)
# 같은 동작을 OS 별로 선언한다. herdr 는 액션 id 중복을 허용하지 않으므로 Windows 쪽 id 에 -windows 를 붙인다.
# host 루프는 "feedbag" workspace 의 pane 안에서 돌고, hook 은 그 pane 이 살아 있는지만 확인한다.

# ---------------------------------------------------------------- Linux / macOS

[[startup]]
platforms = ["linux", "macos"]
command = ["python3", "-X", "utf8", "src/feedbag.py", "ensure"]

[[events]]
on = "workspace.created"
platforms = ["linux", "macos"]
command = ["python3", "-X", "utf8", "src/feedbag.py", "ensure"]

[[actions]]
id = "start"
title = "feedbag: show usage block"
platforms = ["linux", "macos"]
contexts = ["global"]
command = ["python3", "-X", "utf8", "src/feedbag.py", "ensure"]

[[actions]]
id = "refresh"
title = "feedbag: refresh usage now"
platforms = ["linux", "macos"]
contexts = ["global"]
command = ["python3", "-X", "utf8", "src/feedbag.py", "refresh"]

[[actions]]
id = "stop"
title = "feedbag: hide usage block"
platforms = ["linux", "macos"]
contexts = ["global"]
command = ["python3", "-X", "utf8", "src/feedbag.py", "stop"]

# ---------------------------------------------------------------- Windows

[[startup]]
platforms = ["windows"]
command = ["python", "-X", "utf8", "src/feedbag.py", "ensure"]

[[events]]
on = "workspace.created"
platforms = ["windows"]
command = ["python", "-X", "utf8", "src/feedbag.py", "ensure"]

[[actions]]
id = "start-windows"
title = "feedbag: show usage block"
platforms = ["windows"]
contexts = ["global"]
command = ["python", "-X", "utf8", "src/feedbag.py", "ensure"]

[[actions]]
id = "refresh-windows"
title = "feedbag: refresh usage now"
platforms = ["windows"]
contexts = ["global"]
command = ["python", "-X", "utf8", "src/feedbag.py", "refresh"]

[[actions]]
id = "stop-windows"
title = "feedbag: hide usage block"
platforms = ["windows"]
contexts = ["global"]
command = ["python", "-X", "utf8", "src/feedbag.py", "stop"]
